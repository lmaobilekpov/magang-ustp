<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Karyawan - USTP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            color: #1e293b;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 34px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
        }
        h1 { margin: 0 0 8px; color: #1e3a5f; font-size: 26px; }
        .subtitle { margin: 0 0 26px; color: #64748b; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 13px;
            background: #1e5f7a;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #174b61; }
        .alert-error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }
        .info {
            margin-top: 22px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Portal Karyawan USTP</h1>
        <p class="subtitle">Verifikasi identitas untuk melihat riwayat dokumen masuk dan dokumen keluar Anda.</p>

        {% if pesan_error %}
        <div class="alert-error">{{ pesan_error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="tanggal_lahir">Tanggal Lahir</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
            <button type="submit">Verifikasi dan Lihat Riwayat</button>
        </form>

        <div class="info">
            Data riwayat hanya dapat dilihat setelah verifikasi berhasil. Jika mengalami kendala, silakan hubungi resepsionis.
        </div>
    </main>
</body>
</html>
